<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nexus Finance</title>
  <meta name="theme-color" content="#0F172A" />
  <meta name="description" content="Panel de finanzas personales Nexus" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nexus" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v7" />
  <script>
    // Limpia copias viejas guardadas (service worker y caché) para que el panel siempre se vea actual.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    }
    if ("caches" in window) {
      caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); });
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/icons/icon-192.png" alt="" width="30" height="30" />
      <span>Nexus Finance</span>
    </div>
    <select id="month" aria-label="Mes" title="Mes"></select>
  </header>

  <main class="wrap">
    <section class="hero" id="hero" aria-label="Saldos"></section>

    <section class="totals" id="totals" aria-label="Totales del mes"></section>

    <section class="card-section">
      <h2>Movimientos</h2>
      <div id="txns" class="list"></div>
    </section>

    <section class="card-section">
      <h2>Gastos por categoría</h2>
      <div id="categories" class="bars"></div>
    </section>

    <section class="card-section">
      <h2>Tendencia</h2>
      <div class="legend">
        <span class="lg"><i class="d inc"></i>Ingresos</span>
        <span class="lg"><i class="d exp"></i>Gastos</span>
      </div>
      <div id="trend" class="trend"></div>
    </section>

    <section class="card-section">
      <h2>Suscripciones</h2>
      <div id="subs" class="list compact"></div>
    </section>

    <p id="updated" class="updated"></p>
    <p id="err" class="err" hidden>No se pudo cargar el panel. Revisa tu conexión o inténtalo de nuevo.</p>
  </main>

  <script src="/app.js?v7"></script>
</body>
</html>
