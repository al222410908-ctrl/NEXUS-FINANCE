[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-finance"
version = "0.1.0"
description = "NexusFinance: bot de Telegram para finanzas personales, costo cero"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["backend*"]