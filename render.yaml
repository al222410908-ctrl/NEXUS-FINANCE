services:
  - type: web
    name: nexus-finance
    runtime: python
    rootDir: .
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CRON_AUTH_TOKEN
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false